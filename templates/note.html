<!DOCTYPE html>

<html lang="en">
    <head>
        <title>{{ note['title'] }} · Obsidian clone</title>

        <link rel="stylesheet" href="{{ url_for('static', filename='main.css') }}">
    </head>

    <body>
        <div class="app">
            <header class="app-header">
                <a href="{{ url_for('index') }}" class="nav-logo">Obsidian clone</a>

                <nav class="nav-links">

                    {% if session.user_id %}
                        <span class="nav-username">{{ session.username }}</span>

                        <a href="{{ url_for('new_note') }}" class="button">New note</a>

                        <form method="POST" action="{{ url_for('logout') }}">
                            <button type="submit" class="button button-danger">Log out</button>
                        </form>
                    {% else %}
                        <a href="{{ url_for('login') }}">Log in</a>

                        <a href="{{ url_for('register') }}" class="button">Register</a>
                    {% endif %}
                </nav>
            </header>

            <main>
                <div class="note-header">
                    <h1>{{ note['title'] }}</h1>

                    <div class="header-actions">
                        <a href="{{ url_for('edit_note', note_id=note['id']) }}" class="button">Edit</a>

                        <form method="POST" action="{{ url_for('delete_note', note_id=note['id']) }}">
                            <button type="submit" class="button button-danger">Delete</button>
                        </form>
                    </div>
                </div>

                <p>{{ note['content'] }}</p>

                <p class="meta">
                    Last updated: {{ note['updated_at'] }} &nbsp;·&nbsp;

                    <span class="heat-badge">⬡ {{ heat }}</span> &nbsp;·&nbsp;
                    
                    <span class="age-badge age-{{ age_status }}">{{ age_status }} · {{ age_days }}d</span>
                </p>

                <a href="{{ url_for('index') }}">← All notes</a>
            </main>
        </div>
    </body>
</html>
